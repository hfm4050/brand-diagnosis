<!doctype html>
<meta charset="utf-8">
<title>암진단금 사례 보드</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#0d0d0d; }
  body { font-family:"Noto Sans CJK KR","Noto Sans CJK JP",sans-serif; -webkit-font-smoothing:antialiased; }

  #board {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 120% 90% at 50% 40%, #2c5f4d 0%, #234e40 55%, #1b3d32 100%);
    border:9px solid #d9c9a8;
    border-radius:16px;
    box-shadow: inset 0 0 180px rgba(0,0,0,.45);
  }
  /* 분필 가루 질감 */
  #grain { position:absolute; inset:0; opacity:.05; pointer-events:none;
    background-image:radial-gradient(#fff 1px, transparent 1px);
    background-size:5px 5px; }

  #wrap { position:absolute; left:78px; right:78px; top:64px; }

  #title { font-size:33px; color:#a8c4b6; letter-spacing:.4px; }
  #rule  { height:2px; background:linear-gradient(90deg,#7d9b8c,rgba(125,155,140,.15)); margin:24px 0 48px; transform-origin:left center; }

  .grid { display:grid; grid-template-columns:410px 700px 1fr; align-items:baseline; }
  #head { font-size:31px; color:#e4efe8; margin-bottom:46px; }
  #head div:nth-child(2), #head div:nth-child(3) { padding-left:6px; }

  .row { margin-bottom:52px; }
  .c1 { font-size:30px; color:#f2f6f3; white-space:nowrap; }
  .c2 { font-size:29px; color:#5fb3e8; padding-left:6px; position:relative; display:flex; }
  .c3 { font-size:30px; color:#f0c93e; padding-left:6px; white-space:nowrap; }
  .c2 .txt { position:relative; white-space:nowrap; }
  .c2 svg { position:absolute; left:6px; top:0; overflow:visible; pointer-events:none; }
  .pen { position:absolute; pointer-events:none; }
</style>

<div id="board"><div id="grain"></div></div>
<div id="wrap">
  <div id="title">#2 3:30~6:00 놓치는 암진단금 사례</div>
  <div id="rule"></div>
  <div id="head" class="grid"><div>진단서</div><div>결과지에 이 글자</div><div>검토 담보</div></div>
  <div id="rows"></div>
</div>

<script>
const ROWS = [
  ["① 대장·위 용종 D12",        "high grade dysplasia",                                "제자리암"],
  ["② 직장 용종 D37",           "Neuroendocrine tumor G1 / Carcinoid / GIST",          "일반암"],
  ["③ 자궁경부 N87",            "High grade squamous intraepithelial lesion",          "제자리암"],
  ["④ 피부 D48.5",              "Dermatofibrosarcoma protuberans",                     "일반암 ('21 이전 가입)"],
  ["⑤ 방광 D09",                "Noninvasive papillary urothelial carcinoma",          "일반암 ('08 이전 가입)"],
  ["⑥ 갑상선 C73 + 림프절 C77", "전이 (상품설명서 확인)",                              "일반암 검토 (~'20 가입)"],
  ["⑦ 연조직·연골 D21 / D16",   "Desmoid fibromatosis / Synovial chondromatosis",      "경계성종양"],
  ["⑧ 뇌하수체 D35.2",          "?",                                                   "?"],
];

// ── 타이밍(초) ─────────────────────────────────────────────
const T = { intro:0.75, step:1.25, appear:0.42, penDelay:0.30, draw:0.52, outro:1.9 };
const TOTAL = T.intro + ROWS.length * T.step + T.outro;
const rowStart = i => T.intro + i * T.step;
const penStart = i => rowStart(i) + T.penDelay;
window.SWOOSH_TIMES = ROWS.map((_, i) => +penStart(i).toFixed(3));
window.TOTAL = TOTAL;

const easeOut  = x => 1 - Math.pow(1 - x, 3);
const easeInOut= x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;
const clamp01  = x => x < 0 ? 0 : x > 1 ? 1 : x;

// ── DOM 구성 ───────────────────────────────────────────────
const rowsEl = document.getElementById("rows");
const items = ROWS.map(([a,b,c]) => {
  const r = document.createElement("div");
  r.className = "row grid";
  r.innerHTML = `<div class="c1"></div><div class="c2"><span class="txt"></span></div><div class="c3"></div>`;
  r.querySelector(".c1").textContent = a;
  r.querySelector(".c2 .txt").textContent = b;
  r.querySelector(".c3").textContent = c;
  rowsEl.appendChild(r);
  return r;
});

// 텍스트 폭을 재서 밑줄 SVG(살짝 흔들리는 손그림 선)와 펜을 만든다
const NS = "http://www.w3.org/2000/svg";
const strokes = items.map((r, i) => {
  const txt = r.querySelector(".c2 .txt");
  const w = Math.max(txt.getBoundingClientRect().width, 14);
  const h = txt.getBoundingClientRect().height;
  const y0 = h + 5;

  // 손으로 그은 듯한 미세한 물결
  let d = `M 0 ${y0}`;
  const seg = Math.max(3, Math.min(11, Math.round(w / 55)));
  for (let s = 1; s <= seg; s++) {
    const x = (w / seg) * s;
    const amp = Math.min(1.5, w / 260);
    const wob = (Math.sin(s * 1.7 + i) * 1.6 + Math.sin(s * 0.6) * 0.9) * amp;
    d += ` L ${x.toFixed(1)} ${(y0 + wob).toFixed(1)}`;
  }

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("width", w + 8); svg.setAttribute("height", h + 12);
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d);
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", "#ef6f5e");
  p.setAttribute("stroke-width", "3.4");
  p.setAttribute("stroke-linecap", "round");
  svg.appendChild(p);
  r.querySelector(".c2").appendChild(svg);

  const len = p.getTotalLength();
  p.style.strokeDasharray = len;

  // 펜
  const pen = document.createElement("div");
  pen.className = "pen";
  pen.innerHTML = `<svg width="78" height="78" viewBox="0 0 78 78"
       style="transform:translate(-12px,-64px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))">
      <polygon points="14.5,50.4 25.1,59.5 63.3,14.5 52.7,5.5" fill="#efe9d9"/>
      <polygon points="14.5,50.4 19.8,54.9 58,10 52.7,5.5"      fill="#cfc7b2"/>
      <polygon points="52.7,5.5 63.3,14.5 68,9 58,0.5"          fill="#c8503f"/>
      <polygon points="12,64 25.1,59.5 14.5,50.4"               fill="#3b3b3b"/>
      <polygon points="12,64 19.6,61.4 15.6,57.9"               fill="#ef6f5e"/>
    </svg>`;
  r.querySelector(".c2").appendChild(pen);
  return { path:p, len, pen, w, y0 };
});

// ── 시간 t(초)의 화면 상태를 그린다 ────────────────────────
function renderAt(t) {
  const ti = clamp01(t / T.intro);
  document.getElementById("title").style.opacity = easeOut(ti);
  document.getElementById("rule").style.transform = `scaleX(${easeOut(clamp01((t-.18)/(T.intro-.1)))})`;
  document.getElementById("head").style.opacity = easeOut(clamp01((t - .3) / .5));

  items.forEach((r, i) => {
    const a = clamp01((t - rowStart(i)) / T.appear);
    r.style.opacity = easeOut(a);
    r.style.transform = `translateY(${(1 - easeOut(a)) * 16}px)`;

    const st = strokes[i];
    const dp = clamp01((t - penStart(i)) / T.draw);
    const e = easeInOut(dp);
    st.path.style.strokeDashoffset = st.len * (1 - e);

    // 펜은 선을 그리는 동안만 보이고, 선 끝을 따라간다
    const visible = dp > 0 && dp < 1;
    st.pen.style.opacity = visible ? (dp < .12 ? dp / .12 : dp > .88 ? (1 - dp) / .12 : 1) : 0;
    st.pen.style.left = (6 + st.w * e) + "px";
    st.pen.style.top  = st.y0 + "px";
  });
}
window.renderAt = renderAt;
renderAt(0);
</script>
